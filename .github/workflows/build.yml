name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Setup Forge 1.8.9 MDK
        run: |
          wget -O mdk.zip https://minecraftforge.net
          unzip mdk.zip
          rm -rf src/main/java/com/example
          mv src/main/java/com/mod/* src/main/java/
          chmod +x gradlew
      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: my-built-mod
          path: build/libs/*.jar
